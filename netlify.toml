[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Media filenames are stable, so cache them hard.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Short cache so an updated CV actually reaches people.
[[headers]]
  for = "/JEAN_KIM_CV.pdf"
  [headers.values]
    Cache-Control = "public, max-age=3600"
